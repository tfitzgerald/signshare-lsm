name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean old Android build files
        run: |
          rm -rf android
          rm -rf build
          rm -rf .dart_tool

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.signshare --project-name signshare_lsm .

      - name: Set generated Android compile SDK
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/gradle.properties")
          key = "flutter.compileSdkVersion="
          value = f"{key}36"

          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith(key):
                  lines[index] = value
                  break
          else:
              lines.append(value)

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Get dependencies again after Android generation
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signshare-lsm-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk